<title>Non-Local Effects</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,600&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --sea:#dbeffb;
    --sea-2:#c7e6f7;
    --land:#cfeaae;
    --land-edge:#3d8a33;
    --surface:#fffefb;
    --surface-2:#f3f7e9;
    --ink:#152318;
    --ink-2:#46543f;
    --muted:#828f79;
    --border:rgba(21,35,24,.14);
    --border-soft:rgba(21,35,24,.08);
    --accent:#6a3fd6;
    --accent-ink:#ffffff;
    --accent-soft:#ece2fc;
    --gold:#e08a0c;
    --gold-soft:#fbe9cc;
    --worsen:#e34948;
    --worsen-soft:#fbe1e0;
    --relieve:#2a78d6;
    --relieve-soft:#dcebfa;
    --neutral-node:#a9b39a;
    --shadow:0 1px 2px rgba(21,35,24,.06), 0 8px 24px -12px rgba(21,35,24,.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sea);
    color:var(--ink);
    font-family:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:1320px;
    margin:0 auto;
    padding:20px 20px 48px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  a{color:var(--accent);}

  /* ---------- header ---------- */
  header.top{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:22px 26px;
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    align-items:flex-end;
    justify-content:space-between;
  }
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    letter-spacing:.11em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:500;
    margin:0 0 6px;
  }
  h1{
    font-family:"Fraunces",Georgia,serif;
    font-weight:600;
    font-size:clamp(26px,3.4vw,38px);
    line-height:1.06;
    margin:0 0 8px;
    text-wrap:balance;
    letter-spacing:-.01em;
  }
  h1 em{
    font-style:italic;
    color:var(--accent);
  }
  header.top p.sub{
    margin:0;
    color:var(--ink-2);
    font-size:14.5px;
    max-width:56ch;
    line-height:1.5;
  }
  .meta-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  .meta-pill{
    font-family:"IBM Plex Mono",monospace;
    font-size:11.5px;
    color:var(--ink-2);
    background:var(--surface-2);
    border:1px solid var(--border-soft);
    padding:5px 10px;
    border-radius:999px;
    white-space:nowrap;
  }

  /* ---------- layout ---------- */
  .layout{
    display:grid;
    grid-template-columns:296px 1fr;
    gap:16px;
    align-items:start;
  }
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:16px 16px 18px;
  }
  .panel h2{
    font-family:"Fraunces",Georgia,serif;
    font-weight:600;
    font-size:15px;
    margin:0 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel h2 .num{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    color:var(--muted);
    font-weight:400;
  }

  /* ---------- sidebar / line list ---------- */
  .sidebar{
    display:flex;
    flex-direction:column;
    gap:14px;
    position:sticky;
    top:16px;
  }
  @media (max-width:860px){ .sidebar{position:static;} }

  .line-list{display:flex;flex-direction:column;gap:7px;}
  .line-chip{
    text-align:left;
    width:100%;
    border:1.5px solid var(--border);
    background:var(--surface);
    border-radius:12px;
    padding:9px 11px;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:10px;
    transition:background .12s ease, border-color .12s ease, transform .12s ease;
  }
  .line-chip:hover{background:var(--surface-2);}
  .line-chip:focus-visible{outline:2.5px solid var(--accent);outline-offset:1px;}
  .line-chip.active{
    background:var(--accent-soft);
    border-color:var(--accent);
  }
  .rank-badge{
    font-family:"IBM Plex Mono",monospace;
    font-weight:500;
    font-size:12px;
    width:22px;height:22px;
    border-radius:7px;
    background:var(--gold-soft);
    color:#8a5407;
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .line-chip.active .rank-badge{background:var(--accent);color:#fff;}
  .line-chip .lc-main{flex:1;min-width:0;}
  .line-chip .lc-route{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .line-chip .lc-sub{
    font-family:"IBM Plex Mono",monospace;
    font-size:10.5px;
    color:var(--muted);
    margin-top:1px;
  }
  .warn-dot{
    flex:none;
    width:16px;height:16px;
    border-radius:50%;
    background:var(--gold-soft);
    color:#8a5407;
    font-size:10px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- legend ---------- */
  .legend-row{
    display:flex;
    align-items:flex-start;
    gap:9px;
    font-size:12.5px;
    color:var(--ink-2);
    line-height:1.45;
    margin-bottom:9px;
  }
  .legend-row:last-child{margin-bottom:0;}
  .swatch{flex:none;margin-top:2px;}
  .swatch svg{display:block;}
  .legend-note{
    font-size:12px;
    color:var(--muted);
    border-top:1px dashed var(--border);
    margin-top:10px;
    padding-top:10px;
    line-height:1.5;
  }

  /* ---------- stats ---------- */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .stat-tile{
    border-radius:11px;
    padding:9px 10px;
    background:var(--surface-2);
    border:1px solid var(--border-soft);
  }
  .stat-tile .n{
    font-family:"IBM Plex Mono",monospace;
    font-size:19px;
    font-weight:500;
    line-height:1;
  }
  .stat-tile .lbl{font-size:11px;color:var(--muted);margin-top:4px;}
  .stat-tile.worsen .n{color:var(--worsen);}
  .stat-tile.relieve .n{color:var(--relieve);}

  /* ---------- map ---------- */
  .mappane{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .map-svg-wrap{
    background:linear-gradient(180deg,var(--sea-2),var(--sea));
    border-radius:12px;
    border:1px solid var(--border-soft);
    overflow:hidden;
  }
  svg.map-svg{width:100%;height:auto;display:block;max-height:74vh;}
  .land-path{fill:var(--land);stroke:var(--land-edge);stroke-width:1.6;stroke-linejoin:round;}
  .line-active-path{
    fill:none;
    stroke:var(--accent);
    stroke-width:3.4;
    stroke-linecap:round;
    filter:drop-shadow(0 0 4px rgba(106,63,214,.35));
  }
  .line-stub{
    fill:none;
    stroke:var(--accent);
    stroke-width:2.4;
    stroke-linecap:round;
    stroke-dasharray:3 4;
    opacity:.75;
  }
  .endpoint-pin{
    fill:var(--surface);
    stroke:var(--accent);
    stroke-width:2.4;
  }
  .endpoint-label{
    font-family:"IBM Plex Mono",monospace;
    font-size:9.5px;
    fill:var(--ink);
    font-weight:500;
  }
  .endpoint-label-bg{fill:var(--surface);opacity:.86;}
  .missing-badge-bg{fill:var(--gold-soft);stroke:var(--gold);stroke-width:1.4;}
  .missing-badge-txt{
    font-family:"IBM Plex Mono",monospace;
    font-size:10px;font-weight:700;fill:#8a5407;
    text-anchor:middle;
  }
  circle.node-marker, rect.node-marker{
    cursor:pointer;
    transition:opacity .1s ease;
  }
  circle.node-marker:hover, rect.node-marker:hover{opacity:1 !important;}
  .map-caption{
    font-size:11.5px;
    color:var(--muted);
    padding:0 4px;
    line-height:1.5;
  }

  /* ---------- tooltip / drawer ---------- */
  .tooltip{
    position:fixed;
    z-index:40;
    background:var(--ink);
    color:#fbf9f4;
    border-radius:10px;
    padding:8px 11px;
    font-size:12px;
    line-height:1.5;
    max-width:230px;
    pointer-events:none;
    box-shadow:0 10px 28px -10px rgba(0,0,0,.45);
  }
  .tooltip b{font-weight:600;}
  .tooltip .tt-sf{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    margin-top:3px;
    display:block;
  }

  .drawer{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:18px 20px;
  }
  .drawer-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:10px;
  }
  .drawer-head h3{
    font-family:"Fraunces",Georgia,serif;
    font-weight:600;
    font-size:19px;
    margin:0;
  }
  .pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11.5px;
    font-weight:600;
    padding:4px 10px;
    border-radius:999px;
  }
  .pill.worsen{background:var(--worsen-soft);color:#9c2423;}
  .pill.relieve{background:var(--relieve-soft);color:#175393;}
  .pill.tradeoff{background:var(--gold-soft);color:#8a5407;}
  .pill.low{background:var(--surface-2);color:var(--muted);}
  .close-btn{
    background:var(--surface-2);
    border:1px solid var(--border-soft);
    border-radius:8px;
    width:28px;height:28px;
    cursor:pointer;
    font-size:15px;
    color:var(--ink-2);
    line-height:1;
  }
  .close-btn:hover{background:var(--border-soft);}
  .drawer-body{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  @media (max-width:640px){ .drawer-body{grid-template-columns:1fr;} }
  .drawer-line-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:7px 10px;
    border-radius:9px;
    background:var(--surface-2);
    border:1px solid var(--border-soft);
    font-size:12.5px;
  }
  .drawer-line-row .route{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-2);}
  .eff-tag{font-weight:600;font-size:11.5px;}
  .eff-tag.worsen{color:var(--worsen);}
  .eff-tag.relieve{color:var(--relieve);}
  .eff-tag.na{color:var(--muted);font-weight:400;}

  /* ---------- offmap ---------- */
  details.offmap summary{
    cursor:pointer;
    font-size:12.5px;
    color:var(--ink-2);
    font-weight:500;
    padding:2px 0;
  }
  details.offmap summary::marker{color:var(--accent);}
  .offmap-list{
    margin-top:8px;
    display:flex;
    flex-direction:column;
    gap:5px;
    max-height:260px;
    overflow-y:auto;
    padding-right:2px;
  }
  .offmap-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    font-size:12px;
    padding:5px 8px;
    border-radius:8px;
    background:var(--surface-2);
  }
  .offmap-row.material{background:var(--gold-soft);}
  .offmap-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  footer.foot{
    text-align:center;
    font-size:11.5px;
    color:var(--muted);
    padding:6px 0 0;
  }

  // ---------- swatches ----------

  // ---------- header ----------

  // ---------- line list ----------

  // ---------- legend ----------
  function Legend(){

  // ---------- map ----------
  function project(c){ return c; }

  function MapPane(props){
    var line = props.line;
    var effectMap = props.effectMap;
    var W = DATA.W, H = DATA.H;
    var endpointIds = {};
    endpointIds[String(line.bus0)] = true;
    endpointIds[String(line.bus1)] = true;

    var markers = [];
    Object.keys(DATA.nodes).forEach(function(id){
      var n = DATA.nodes[id];
      if(!n.coord) return;
      if(endpointIds[id]) return; // drawn separately as substation pin
      var eff = effectMap[id];
      var material = eff && eff.material;
      var ev = eff ? eff.ev : 0;
      var r = material ? Math.min(9, 4.2+Math.abs(ev)*6.5) : 2.4;
      var fill = material ? (ev>0?"var(--worsen)":"var(--relieve)") : "var(--neutral-node)";
      var op = material ? (props.hoverId===id||props.pinnedId===id?1:0.92) : 0.5;
      var common = {
        key:id,
        onMouseEnter:function(e){ props.onHover(id, e.currentTarget); },
        onMouseLeave:function(){ props.onHover(null,null); },
        onClick:function(){ props.onPin(id); },
        opacity:op
      };
      if(material && ev<0){
        var s = r*1.35;
        markers.push(h("rect",Object.assign({className:"node-marker",
          x:n.coord[0]-s/2, y:n.coord[1]-s/2, width:s, height:s, fill:fill,
          transform:"rotate(45 "+n.coord[0]+" "+n.coord[1]+")",
          stroke:props.pinnedId===id?"var(--ink)":"none", strokeWidth:1.2},common)));
      } else {
        markers.push(h("circle",Object.assign({className:"node-marker",
          cx:n.coord[0], cy:n.coord[1], r:r, fill:fill,
          stroke:props.pinnedId===id?"var(--ink)":"none", strokeWidth:1.2},common)));
      }
    });

    // active line geometry
    var lineEls = [];
    var c0 = line.bus0Coord, c1 = line.bus1Coord;
    if(c0 && c1){
      lineEls.push(h("line",{key:"ln", className:"line-active-path", x1:c0[0],y1:c0[1],x2:c1[0],y2:c1[1]}));
      var epDist = Math.hypot(c1[0]-c0[0], c1[1]-c0[1]);
      var stacked = epDist < 55;
      var epLabels = [];
      [ [c0,line.bus0Name], [c1,line.bus1Name] ].forEach(function(pair,i){
        var c=pair[0], name=pair[1];
        var above = stacked ? (i===0) : true;
        var ly = above ? c[1]-14 : c[1]+6;
        var ty = above ? c[1]-4 : c[1]+16;
        lineEls.push(h("circle",{key:"pin"+i, className:"endpoint-pin", cx:c[0],cy:c[1], r:6}));

          h("text",{className:"endpoint-label", x:c[0]+12, y:ty}, name)

      });
      lineEls = lineEls.concat(epLabels);

      var known = c0 || c1;
      var knownName = c0 ? line.bus0Name : line.bus1Name;
      var missingName = c0 ? line.bus1Name : line.bus0Name;
      if(known){
        var stubEnd = [known[0]+ (known[0]<W/2?46:-46), known[1] - 30];
        lineEls.push(h("g",{key:"stub"},
          h("line",{className:"line-stub", x1:known[0],y1:known[1], x2:stubEnd[0],y2:stubEnd[1]}),
          h("circle",{className:"endpoint-pin", cx:known[0],cy:known[1], r:6}),
          h("rect",{className:"endpoint-label-bg", x:known[0]+8, y:known[1]-14, width:Math.max(30,knownName.length*5.6+8), height:14, rx:4}),
          h("text",{className:"endpoint-label", x:known[0]+12, y:known[1]-4}, knownName),
          h("circle",{className:"missing-badge-bg", cx:stubEnd[0],cy:stubEnd[1], r:9}),
          h("text",{className:"missing-badge-txt", x:stubEnd[0], y:stubEnd[1]+3.5}, "?")
        ));
      }
    }

    return h("div",{className:"mappane"},
      h("div",{className:"map-svg-wrap"},
        h("svg",{className:"map-svg", viewBox:"0 0 "+W+" "+H},
          h("rect",{x:0,y:0,width:W,height:H,fill:"transparent"}),
          h("path",{className:"land-path", d:DATA.mainPath}),
          DATA.extraPaths.map(function(p,i){return h("path",{key:"ex"+i, className:"land-path", d:p});}),
          lineEls,
          markers
        )
      ),
      h("p",{className:"map-caption"},

      )
    );
  }

  // ---------- tooltip ----------
  function Tooltip(props){
    if(!props.id) return null;
    var n = DATA.nodes[props.id];

      h(Header,null),
      h("div",{className:"layout"},
        h("div",{className:"sidebar"},
          h(LineList,{selected:selected, onSelect:function(id){ setSelected(id); setPinnedId(null); }}),
          h(Stats,{worsenCount:worsenCount, relieveCount:relieveCount, offMapMaterial:offMapMaterial, threshold:DATA.effects[selected].threshold}),
          h(Legend,null),
          h(OffMap,{rows:{all:offRows, materialCount:offMapMaterial}})
        ),
        h(MapPane,{line:line, effectMap:effectMap, hoverId:hoverId, pinnedId:pinnedId, onHover:onHover, onPin:function(id){ setPinnedId(pinnedId===id?null:id); }})
      ),
      h(Drawer,{id:activeId, onClose:function(){ setPinnedId(null); setHoverId(null); }}),
      h(Tooltip,{id:hoverId && hoverId!==pinnedId ? hoverId : null, pos:pos, effectMap:effectMap}),
      h("footer",{className:"foot"},"Step 3A · Harshitha · shift factors from Person 2, binding-hour flow direction confirmed against Person 1's baseline flows.")
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
